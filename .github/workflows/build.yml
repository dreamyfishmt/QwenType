name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type check and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check --output-format=github
          uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      # Fast feedback: the same tests run again on Windows in the build job.
      - name: Install Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run -m unittest discover -s tests -t . -v

  build:
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Tag builds take their version from the tag (v1.2.3 -> 1.2.3); other builds keep
      # pyproject's version and add the commit to the file name.
      - name: Set version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            uv version $tag.TrimStart("v") --frozen
            if ($LASTEXITCODE -ne 0) { throw "Tag $tag is not a valid version" }
            uv sync --frozen --reinstall-package qwentype
            if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }
            $label = $tag
          } else {
            $label = "$(uv version --short)-$("${{ github.sha }}".Substring(0, 7))"
          }
          $version = uv run python -c "import qwentype; print(qwentype.__version__)"
          "QwenType version: $version (file label: $label)"
          "label=$label" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run -m unittest discover -s tests -t . -v

      - name: Build QwenType.exe
        run: uv run pyinstaller --noconfirm --clean qwentype.spec

      - name: Check version and rename
        run: |
          $exe = Get-Item dist\QwenType.exe
          $info = $exe.VersionInfo
          "File version: $($info.FileVersion)  Product version: $($info.ProductVersion)"
          if ($info.ProductVersion -ne "${{ steps.version.outputs.version }}") {
            throw "exe ProductVersion '$($info.ProductVersion)' != '${{ steps.version.outputs.version }}'"
          }
          $name = "QwenType-${{ steps.version.outputs.label }}.exe"
          Copy-Item $exe "dist\$name"
          "Built ${name}: {0:N1} MiB" -f ($exe.Length / 1MB)
          "### ${name}: {0:N1} MiB (version ${{ steps.version.outputs.version }})" -f ($exe.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenType-${{ steps.version.outputs.label }}
          path: dist/QwenType-${{ steps.version.outputs.label }}.exe
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QwenType-${{ needs.build.outputs.label }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QwenType-${{ needs.build.outputs.label }}.exe
          generate_release_notes: true
