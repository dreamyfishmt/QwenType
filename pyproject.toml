[project]
name = "qwentype"
version = "0.1.0"
description = "Hold Right Ctrl, speak, release — local Qwen3-ASR voice typing for Windows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pyside6-essentials>=6.12.0",
    "pywin32>=312 ; sys_platform == 'win32'",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

# Windowed entry point (no console window); `uv run qwentype`
[project.gui-scripts]
qwentype = "qwentype:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    "types-pywin32>=312.0.0.20261006",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous Unicode: the UI and prompts use “”, ’, – and CJK on purpose
    "SIM102",  # nested ifs read better where each level has its own comment
    "SIM105",  # try/except/pass is clearer than contextlib.suppress
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "standard"
# pywin32 is only installed on Windows; types-pywin32 provides its stubs everywhere.
reportMissingModuleSource = false
