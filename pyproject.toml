[project]
name = "qwentype"
version = "0.1.0"
description = "Hold Right Ctrl, speak, release — local Qwen3-ASR voice typing for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pyside6-essentials>=6.12.0",
    "pywin32>=312 ; sys_platform == 'win32'",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

# Windowed entry point (no console window); `uv run qwentype`
[project.gui-scripts]
qwentype = "qwentype:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
